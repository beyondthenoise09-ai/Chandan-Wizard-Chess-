<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#192033"/>
      <stop offset="100%" stop-color="#070a12"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4cc"/>
      <stop offset="40%" stop-color="#f5d76e"/>
      <stop offset="80%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#997722"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="100%" stop-color="#805d15"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield / Square with rounded corners -->
  <rect width="512" height="512" rx="104" fill="url(#bgGlow)"/>
  <rect x="16" y="16" width="480" height="480" rx="90" fill="none" stroke="url(#goldRim)" stroke-width="4" stroke-opacity="0.6"/>
  <rect x="26" y="26" width="460" height="460" rx="80" fill="none" stroke="url(#goldRim)" stroke-width="1.5" stroke-dasharray="10 8" stroke-opacity="0.4"/>

  <!-- Center Gothic Knight & Crown Emblem -->
  <g transform="translate(256, 230) scale(1.15)">
    <!-- Crown -->
    <path d="M-55,-120 L-40,-85 L-18,-110 L0,-75 L18,-110 L40,-85 L55,-120 L45,-60 L-45,-60 Z"
          fill="url(#goldGrad)" filter="url(#glow)"/>
    <circle cx="-55" cy="-122" r="4.5" fill="#fff" />
    <circle cx="-18" cy="-112" r="4" fill="#fff" />
    <circle cx="0" cy="-77" r="4.5" fill="#fff" />
    <circle cx="18" cy="-112" r="4" fill="#fff" />
    <circle cx="55" cy="-122" r="4.5" fill="#fff" />

    <!-- Knight Silhouette -->
    <path d="M -25,-55 
             C -20,-70 5,-72 30,-50 
             C 45,-38 52,-15 48,15 
             C 44,40 50,65 65,85 
             L 60,95 L -60,95 L -55,85
             C -45,65 -45,35 -35,15
             C -30,-5 -45,-15 -42,-35
             C -40,-48 -35,-52 -25,-55 Z" 
          fill="url(#goldGrad)"/>

    <!-- Knight Details & Mane Cutouts -->
    <path d="M 15,-35 C 25,-25 28,-10 25,10" stroke="#070a12" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <circle cx="-20" cy="-35" r="4.5" fill="#070a12"/>
    <path d="M -30,-20 C -25,-15 -20,-15 -15,-20" stroke="#070a12" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Base Pedestal -->
    <rect x="-70" y="95" width="140" height="18" rx="5" fill="url(#goldGrad)"/>
    <rect x="-82" y="113" width="164" height="14" rx="4" fill="url(#goldGrad)" opacity="0.9"/>
  </g>

  <!-- Typography / Inscription -->
  <text x="256" y="420" 
        text-anchor="middle" 
        font-family="'Cinzel', 'Georgia', serif" 
        font-size="28" 
        font-weight="900" 
        letter-spacing="5" 
        fill="url(#goldGrad)" 
        filter="url(#glow)">CHANDAN</text>

  <text x="256" y="448" 
        text-anchor="middle" 
        font-family="'Cinzel', 'Georgia', serif" 
        font-size="20" 
        font-weight="700" 
        letter-spacing="7" 
        fill="#f0ece1">WIZARD CHESS</text>

  <text x="256" y="478" 
        text-anchor="middle" 
        font-family="'Inter', sans-serif" 
        font-size="12" 
        font-weight="600" 
        letter-spacing="3" 
        fill="#d4af37">DEVLOPED BY CHANDAN®</text>
</svg>
